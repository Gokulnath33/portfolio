<svg viewBox="0 0 200 200" width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="favBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="70%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>
    <linearGradient id="favBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="favCrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="favMonogram" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <circle cx="100" cy="100" r="98" fill="url(#favBg)" />
  <circle cx="100" cy="100" r="92" fill="none" stroke="url(#favBorder)" stroke-width="3" />
  <circle cx="100" cy="100" r="87" fill="none" stroke="#ffffff" stroke-width="0.75" opacity="0.3" />

  <!-- Crown at Top -->
  <g transform="translate(100, 34)">
    <path d="M -16 6 L -20 -10 L -9 -2 L 0 -14 L 9 -2 L 20 -10 L 16 6 Z" fill="url(#favCrown)" stroke="#fef08a" stroke-width="0.75" />
    <circle cx="-20" cy="-10" r="2.2" fill="#fef08a" />
    <circle cx="0" cy="-14" r="2.8" fill="#ffffff" />
    <circle cx="20" cy="-10" r="2.2" fill="#fef08a" />
    <rect x="-17" y="6" width="34" height="4" rx="1.5" fill="#f59e0b" />
  </g>

  <!-- Monogram in Center -->
  <g transform="translate(100, 104)">
    <path d="M 28 -34 A 42 42 0 1 0 38 12 L 18 12 L 18 2 L 36 2 L 36 8 A 28 28 0 1 1 24 -24 Z" fill="url(#favMonogram)" />
    <path d="M -26 -32 L -16 -32 L -16 32 L -26 32 Z" fill="#ffffff" />
    <path d="M -17 -4 L 12 -32 L 24 -32 L -7 0 Z" fill="#ffffff" />
    <path d="M -12 2 L 18 32 L 6 32 L -17 8 Z" fill="url(#favMonogram)" />
  </g>

  <!-- GOKUL Badge at Bottom -->
  <g transform="translate(100, 164)">
    <rect x="-42" y="-11" width="84" height="22" rx="4" fill="#030712" stroke="url(#favBorder)" stroke-width="1.5" />
    <text x="0" y="4" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="800" font-family="sans-serif" letter-spacing="3.5">GOKUL</text>
  </g>
</svg>